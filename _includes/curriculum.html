<div class="curriculum" data-situations>
  <div class="curriculum-toolbar situations-controls" role="group" aria-label="Управление раскрытием этапов">
    <button type="button" class="situations-control" data-situations-action="open" aria-controls="curriculum-list" hidden>{{ p.curriculum.open_label | escape }}</button>
    <button type="button" class="situations-control" data-situations-action="close" aria-controls="curriculum-list" hidden>{{ p.curriculum.close_label | escape }}</button>
  </div>
  <div class="curriculum-list" id="curriculum-list">
    {% for stage in p.curriculum.stages %}
    <article class="situation-card curriculum-step">
      <h3 class="situation-title" id="stage-title-{{ forloop.index }}"><span class="stage-number">{{ forloop.index }}</span><span>{{ stage.title | escape }}</span></h3>
      <details class="situation-details" aria-labelledby="stage-title-{{ forloop.index }}">
        <summary aria-labelledby="stage-title-{{ forloop.index }} stage-short-{{ forloop.index }}">
          <span class="situation-short" id="stage-short-{{ forloop.index }}">{{ stage.short | escape }}</span>
          <span class="situation-icon" aria-hidden="true"></span>
        </summary>
        <div class="prose situation-body">{{ stage.body }}</div>
      </details>
    </article>
    {% endfor %}
  </div>
  <aside class="prose curriculum-note">{{ p.curriculum.note }}</aside>
</div>
