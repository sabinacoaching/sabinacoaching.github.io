media:
- name: portraits
  label: Фотографии
  input: assets/images
  output: /assets/images
  extensions:
  - jpg
  - jpeg
  - png
  - webp
content:
- name: professional_transition
  label: Профессиональный переход
  type: file
  path: _data/professional_transition.json
  format: json
  fields:
  - name: hero
    label: Первый экран
    type: object
    fields:
    - name: title
      label: Название программы
      type: string
      required: true
    - name: description
      label: Краткое описание
      type: rich-text
      options:
        format: html
        media: false
        switcher: false
    - name: eyebrow
      label: Подпись над названием
      type: string
    - name: duration
      label: Продолжительность
      type: string
    - name: meetings
      label: Количество встреч
      type: string
    - name: group
      label: Размер группы
      type: string
    - name: primary_label
      label: Главная кнопка
      type: string
    - name: secondary_label
      label: Ссылка на программу
      type: string
  - name: portraits
    label: Фотографии
    type: object
    fields:
    - name: hero
      label: Фото на первом экране
      type: image
      options:
        media: portraits
    - name: hero_alt
      label: Описание фото первого экрана
      type: string
    - name: about
      label: Фото в блоке «Обо мне»
      type: image
      options:
        media: portraits
    - name: about_alt
      label: Описание фото в блоке «Обо мне»
      type: string
  - name: about_metrics
    label: 'Обо мне: четыре показателя под фотографией'
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{value}'
    fields:
    - name: value
      label: Показатель
      type: string
    - name: label
      label: Подпись
      type: text
  - name: about_story
    label: 'Обо мне: история под плюсиком'
    type: object
    fields:
    - name: title
      label: Подпись раскрывающейся истории
      type: string
    - name: body
      label: Полная история
      type: rich-text
      options:
        format: html
        media: false
        switcher: false
  - name: outcomes
    label: 'Результаты программы: шесть карточек'
    type: object
    fields:
    - name: items
      label: Нумерованные результаты
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: title
        label: Заголовок результата
        type: text
        description: Номер и оформление карточки появятся автоматически.
      - name: body
        label: Описание результата
        type: rich-text
        options:
          format: html
          media: false
          switcher: false
    - name: bonus
      label: Бонус групповой работы
      type: rich-text
      options:
        format: html
        media: false
        switcher: false
    - name: summary
      label: Результат 12 недель
      type: rich-text
      options:
        format: html
        media: false
        switcher: false
    - name: limitation
      label: Пояснение о длительности перехода
      type: rich-text
      options:
        format: html
        media: false
        switcher: false
  - name: format_stats
    label: Общие параметры под форматом
    type: object
    fields:
    - name: duration
      label: Продолжительность
      type: string
    - name: meetings
      label: Встречи
      type: string
    - name: group
      label: Участники
      type: string
    - name: button
      label: Текст кнопки
      type: string
  - name: sections
    label: Разделы лендинга
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: id
      type: string
      hidden: true
    - name: has_situations
      type: boolean
      hidden: true
    - name: has_barriers
      type: boolean
      hidden: true
    - name: hidden
      label: Скрыть раздел на сайте
      type: boolean
    - name: has_curriculum
      type: boolean
      hidden: true
    - name: paired_layout
      type: string
      hidden: true
    - name: group_id
      type: string
      hidden: true
    - name: group_member
      type: boolean
      hidden: true
    - name: show_question
      type: boolean
      hidden: true
    - name: kind
      type: string
      hidden: true
    - name: tone
      type: string
      hidden: true
    - name: title
      label: Заголовок раздела
      type: text
      description: Перенос строки здесь задаёт перенос в заголовке на широком экране.
    - name: body
      label: Текст раздела
      description: 'Для блока результатов используйте поле «Результаты программы: шесть карточек» выше.'
      type: rich-text
      options:
        format: html
        media: false
        switcher: false
  - name: situations
    label: 'Ситуации: заголовки и раскрывающийся текст'
    type: object
    fields:
    - name: title
      label: Заголовок блока
      type: string
    - name: open_label
      label: Кнопка открытия всех ситуаций
      type: string
    - name: close_label
      label: Кнопка закрытия всех ситуаций
      type: string
    - name: cards
      label: Ситуации
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
