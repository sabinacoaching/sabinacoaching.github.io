      label: Заголовок
      type: string
    - name: duration_label
      label: Подпись продолжительности
      type: string
    - name: duration
      label: Продолжительность
      type: string
    - name: group_label
      label: Подпись размера группы
      type: string
    - name: group
      label: Размер группы
      type: string
    - name: start_label
      label: Подпись начала
      type: string
    - name: start
      label: Начало программы
      type: string
    - name: schedule_label
      label: Подпись расписания
      type: string
    - name: schedule
      label: День и время с часовым поясом
      type: string
    - name: meeting_label
      label: Подпись длительности встречи
      type: string
    - name: meeting
      label: Продолжительность встречи
      type: string
    - name: base_label
      label: Название основного тарифа
      type: string
    - name: base_price
      label: Стоимость основного тарифа
      type: string
