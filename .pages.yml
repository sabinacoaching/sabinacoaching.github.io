        label: Название этапа
        type: string
      - name: short
        label: Видимая часть текста
        type: text
      - name: body
        label: Текст после раскрытия
        type: rich-text
        options:
          format: html
          media: false
          switcher: false
    - name: note
      label: Важно
      type: rich-text
      options:
        format: html
        media: false
        switcher: false
  - name: conditions
    label: Условия и стоимость
